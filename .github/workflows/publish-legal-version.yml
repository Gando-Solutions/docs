# Place at .github/workflows/publish-legal-version.yml in Gando-Solutions/docs.
# Scripts live in .github/legal-archive/ (build-archive.sh, render-pdf.cjs, legal-documents.json).
# One button: Actions > Publish legal version > Run workflow. It archives the text, records the version in the app database, and publishes the release.
# Pick the environment in the form (staging, preview or production): one run per environment. A text corrected for a date that already
# has a version is published as <doc>-<date>-r2, -r3, ... automatically (choose-revision.sh).
name: Publish legal version

on:
  workflow_dispatch:
    inputs:
      document:
        description: Document to publish
        type: choice
        options: [customer-terms, operator-terms, privacy]
        required: true
      effective_date:
        description: Effective date, YYYY-MM-DD
        required: true
      environment:
        description: Environment to publish to
        type: choice
        options: [staging, preview, production]
        default: staging
        required: true
      dry_run:
        description: Build only, no upload, no tag, no PR
        type: boolean
        default: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: publish-legal-version
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      # version name before the revision is chosen; TAG (final name) and RELEASE_TAG are set by the steps below
      BASE_TAG: ${{ inputs.document }}-${{ inputs.effective_date }}
      # production uses the plain secret names, staging and preview the STAGING_ and PREVIEW_ prefixed ones
      MODE: ${{ inputs.environment }}
      SUPPORT_SITE_URL: https://support.gando.app
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # non-production releases get the environment as a tag prefix, so they never collide with production ones
      - name: Resolve the environment
        run: |
          case "$MODE" in
            production) prefix=""; secret_prefix=""; pre=false ;;
            staging|preview) prefix="$MODE-"; secret_prefix="${MODE}_"; pre=true ;;
            *) echo "unknown environment: $MODE" >&2; exit 1 ;;
          esac
          echo "RELEASE_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "SECRET_PREFIX=$secret_prefix" >> "$GITHUB_ENV"
          echo "PRERELEASE=$pre" >> "$GITHUB_ENV"

      # fail before anything irreversible (upload, immutable release) if a secret is missing
      - name: Check secrets
        if: inputs.dry_run != true
        env:
          S1: ${{ secrets[format('{0}LEGAL_ARCHIVE_BUCKET', env.SECRET_PREFIX)] }}
          S2: ${{ secrets[format('{0}LEGAL_ARCHIVE_ENDPOINT', env.SECRET_PREFIX)] }}
          S3: ${{ secrets[format('{0}LEGAL_ARCHIVE_REGION', env.SECRET_PREFIX)] }}
          S4: ${{ secrets[format('{0}LEGAL_ARCHIVE_ACCESS_KEY_ID', env.SECRET_PREFIX)] }}
          S5: ${{ secrets[format('{0}LEGAL_ARCHIVE_SECRET_ACCESS_KEY', env.SECRET_PREFIX)] }}
          S6: ${{ secrets[format('{0}LEGAL_DB_URL', env.SECRET_PREFIX)] }}
        run: |
          missing=0
          for n in 1 2 3 4 5 6; do
            v="S$n"; [ -n "${!v}" ] || { echo "::error::secret #$n is empty or missing (1 bucket, 2 endpoint, 3 region, 4 key id, 5 key secret, 6 database URL; mode prefix: '${SECRET_PREFIX}')"; missing=1; }
          done
          exit $missing

      - name: Check database access
        if: inputs.dry_run != true
        env:
          DB_URL: ${{ secrets[format('{0}LEGAL_DB_URL', env.SECRET_PREFIX)] }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -t -A -c "select count(*) from legal_document_versions" >/dev/null \
            || { echo "::error::cannot read legal_document_versions with the database URL (wrong user, password or host, or the migration is not deployed)"; exit 1; }

      # a corrected text for a date that already has a version becomes -r2, -r3, ...; the same text reuses the name (a re-run)
      - name: Choose the version name
        env:
          DB_URL: ${{ inputs.dry_run != true && secrets[format('{0}LEGAL_DB_URL', env.SECRET_PREFIX)] || '' }}
        run: |
          set -euo pipefail
          sha=$(HASH_ONLY=1 .github/legal-archive/build-archive.sh "$BASE_TAG" "$RUNNER_TEMP/hash" "$(git rev-parse HEAD)")
          tag=$(RELEASE_PREFIX="$RELEASE_PREFIX" DB_URL="$DB_URL" .github/legal-archive/choose-revision.sh "$BASE_TAG" "$sha")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_PREFIX$tag" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$RELEASE_PREFIX$tag" >/dev/null; then
            if [ "$DRY_RUN" = true ]; then echo "::notice::$RELEASE_PREFIX$tag is already published with this text"
            else echo "::error::$RELEASE_PREFIX$tag is already published with this text: nothing to do" >&2; exit 1; fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/render" marked@12.0.2 playwright-core@1.50.0
          npx --yes playwright-core@1.50.0 install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/render/node_modules" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(node -e "console.log(require('$RUNNER_TEMP/render/node_modules/playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Build archive
        run: .github/legal-archive/build-archive.sh "$TAG" "$RUNNER_TEMP/out" "$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: ${{ runner.temp }}/out/${{ env.TAG }}
          if-no-files-found: error

      - name: Upload to Supabase Storage (S3 API)
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}LEGAL_ARCHIVE_ACCESS_KEY_ID', env.SECRET_PREFIX)] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}LEGAL_ARCHIVE_SECRET_ACCESS_KEY', env.SECRET_PREFIX)] }}
          AWS_DEFAULT_REGION: ${{ secrets[format('{0}LEGAL_ARCHIVE_REGION', env.SECRET_PREFIX)] }}
          AWS_ENDPOINT_URL: ${{ secrets[format('{0}LEGAL_ARCHIVE_ENDPOINT', env.SECRET_PREFIX)] }}
          BUCKET: ${{ secrets[format('{0}LEGAL_ARCHIVE_BUCKET', env.SECRET_PREFIX)] }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?LEGAL_ARCHIVE_ACCESS_KEY_ID secret is not set}" "${AWS_SECRET_ACCESS_KEY:?LEGAL_ARCHIVE_SECRET_ACCESS_KEY secret is not set}" "${BUCKET:?LEGAL_ARCHIVE_BUCKET secret is not set}" "${AWS_ENDPOINT_URL:?LEGAL_ARCHIVE_ENDPOINT secret is not set}"
          aws configure set default.s3.addressing_style path
          dir="$RUNNER_TEMP/out/$TAG"
          prefix=$(jq -r .archiveKey "$dir/entry.json")
          # a missing bucket or a wrong key gives an empty PutObject error: head-bucket says which (404 bucket missing, 403 wrong key)
          aws s3api head-bucket --bucket "$BUCKET" >/dev/null || { echo "::error::cannot access the bucket: see the error above (404 = bucket missing, 403 = wrong key)"; exit 1; }
          # Supabase Storage has no Object Lock: never overwrite an archive (the immutable GitHub release is the tamper-proof copy).
          # entry.json is uploaded last, so if it exists the archive is complete: same hash means a re-run, skip; different hash is an error.
          if aws s3api head-object --bucket "$BUCKET" --key "$prefix/entry.json" >/dev/null 2>&1; then
            aws s3api get-object --bucket "$BUCKET" --key "$prefix/entry.json" "$RUNNER_TEMP/existing.json" >/dev/null
            if [ "$(jq -r .sha256 "$RUNNER_TEMP/existing.json")" = "$(jq -r .sha256 "$dir/entry.json")" ]; then
              echo "already archived with the same hash, skipping the upload"; exit 0
            fi
            echo "$prefix is already archived with a different text" >&2; exit 1
          fi
          for f in source.mdx sha256.txt rendered.pdf entry.json; do
            aws s3api put-object --bucket "$BUCKET" --key "$prefix/$f" --body "$dir/$f" --checksum-algorithm SHA256
          done

      - name: Record the version in the database
        if: env.DRY_RUN != 'true'
        env:
          DB_URL: ${{ secrets[format('{0}LEGAL_DB_URL', env.SECRET_PREFIX)] }}
        run: |
          set -euo pipefail
          entry="$RUNNER_TEMP/out/$TAG/entry.json"
          repo="$GITHUB_REPOSITORY"
          # effective_from is the start of the effective day in Paris, stored as UTC (the column has no time zone)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -v document="$(jq -r .document "$entry")" \
            -v version="$(jq -r .version "$entry")" \
            -v effective_from="$(jq -r .effectiveFrom "$entry")" \
            -v sha256="$(jq -r .sha256 "$entry")" \
            -v archive_key="$(jq -r .archiveKey "$entry")" \
            -v commit="$(jq -r .commit "$entry")" \
            -v release_url="https://github.com/$repo/releases/tag/$RELEASE_TAG" \
            -v source_url="https://github.com/$repo/blob/$(jq -r .commit "$entry")/$(jq -r .path "$entry")" <<'SQL'
          INSERT INTO legal_document_versions (document, version, effective_from, sha256, archive_key, commit, release_url, source_url)
          VALUES (:'document', :'version', (:'effective_from'::date::timestamp AT TIME ZONE 'Europe/Paris') AT TIME ZONE 'UTC',
                  :'sha256', :'archive_key', :'commit', :'release_url', :'source_url')
          ON CONFLICT (version) DO NOTHING;
          SQL
          # a re-run is fine only if the stored hash is the same text
          stored=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -q -t -A -v version="$(jq -r .version "$entry")" <<'SQL'
          SELECT sha256 FROM legal_document_versions WHERE version = :'version';
          SQL
          )
          [ "$stored" = "$(jq -r .sha256 "$entry")" ] || { echo "::error::version already recorded with a different hash" >&2; exit 1; }

      # frozen, unlisted Mintlify page of this version (staging and preview pages get the environment prefix, like the release)
      - name: Publish the version page
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          page="legal-versions/$RELEASE_TAG.mdx"
          mkdir -p legal-versions
          # hidden: true keeps the page out of the sidebar and adds noindex, the URL stays reachable
          awk 'NR==1 && $0=="---" { print; print "hidden: true"; next } { print }' "$RUNNER_TEMP/out/$TAG/source.mdx" > "$RUNNER_TEMP/page.mdx"
          [ "$(head -2 "$RUNNER_TEMP/page.mdx" | tail -1)" = "hidden: true" ] || { echo "::error::source has no frontmatter" >&2; exit 1; }
          if git cat-file -e "origin/main:$page" 2>/dev/null; then
            git show "origin/main:$page" | cmp -s - "$RUNNER_TEMP/page.mdx" || { echo "::error::$page already exists with a different text" >&2; exit 1; }
            echo "page already published, skipping"; exit 0
          fi
          cp "$RUNNER_TEMP/page.mdx" "$page"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$page"
          git commit -m "docs(legal): publish $RELEASE_TAG"
          git push origin HEAD:main

      # draft, attach the files, then publish: with "release immutability" enabled on the repo, the tag and the files can no longer change after this
      - name: Tag and release
        if: env.DRY_RUN != 'true'
        run: |
          dir="$RUNNER_TEMP/out/$TAG"
          [ "$PRERELEASE" = true ] && pre=(--prerelease) || pre=()
          notes="$(jq -r '"sha256: \(.sha256)\ncommit: \(.commit)"' "$dir/entry.json")"$'\n'"page: $SUPPORT_SITE_URL/legal-versions/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --draft "${pre[@]}" --target "$(jq -r .commit "$dir/entry.json")" --title "$RELEASE_TAG" \
            --notes "$notes" \
            "$dir/source.mdx" "$dir/sha256.txt" "$dir/rendered.pdf" "$dir/entry.json"
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Summary
        if: always()
        run: |
          f="$RUNNER_TEMP/out/${TAG:-$BASE_TAG}/entry.json"
          {
            echo "### ${TAG:-$BASE_TAG} on **$MODE** (dry run: $DRY_RUN)"
            [ -z "${RELEASE_TAG:-}" ] || [ "$DRY_RUN" = true ] || echo "Page: $SUPPORT_SITE_URL/legal-versions/$RELEASE_TAG"
            if [ -f "$f" ]; then echo '```json'; cat "$f"; echo '```'; fi
            echo "Order: upload, database row, version page, then the release (the only irreversible step). A failed run can be re-run: an identical upload is skipped and an open PR is reused."
          } >> "$GITHUB_STEP_SUMMARY"
